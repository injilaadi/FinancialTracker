server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The browser calls /api/*; strip the prefix and hand the request to the FastAPI container.
  location /api/ {
    proxy_pass http://api:8080/;
    proxy_set_header Host $host;
    client_max_body_size 10m;
  }

  location / {
    try_files $uri /index.html;
  }
}
