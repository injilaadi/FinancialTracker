name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: financetracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/financetracker_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  ml-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  compose-smoke-test:
    needs: [api-test, ml-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the full stack
        run: docker compose up -d --build --wait

      - name: Health checks
        run: |
          curl --fail http://localhost:8080/healthz
          curl --fail http://localhost:8001/healthz

      - name: Import a small CSV end to end
        run: |
          printf 'date,description,amount\n2026-10-01,SHELL OIL 5521,-40.25\n2026-10-02,UBER EATS ORDER 1,-18.00\n' > /tmp/sample.csv
          curl --fail -s -F file=@/tmp/sample.csv http://localhost:8080/import | tee /tmp/import.json
          python3 -c "import json; d = json.load(open('/tmp/import.json')); assert d['imported'] == 2 and d['categorized'] == 2, d"
          curl --fail -s http://localhost:8080/transactions | python3 -c "import json, sys; t = json.load(sys.stdin); assert {x['category'] for x in t} == {'Gas', 'Dining'}, t"

      - name: Monthly summary works (materialized view loaded by init scripts)
        run: |
          curl --fail -s "http://localhost:8080/summary/monthly?months=60" | tee /tmp/summary.json
          python3 -c "import json; r = json.load(open('/tmp/summary.json')); assert sorted(x['category'] for x in r) == ['Dining', 'Gas'], r; assert sum(x['spent_cents'] for x in r) == 5825, r"

      - name: Redis cache serves the second summary request and writes invalidate it
        run: |
          first=$(curl -si "http://localhost:8080/summary/monthly?months=60" | grep -i '^x-cache' | tr -d '\r')
          second=$(curl -si "http://localhost:8080/summary/monthly?months=60" | grep -i '^x-cache' | tr -d '\r')
          echo "first: $first / second: $second"
          echo "$second" | grep -qi 'HIT'
          curl --fail -s -X POST http://localhost:8080/transactions -H 'content-type: application/json' \
            -d '{"posted_on":"2026-10-03","amount_cents":-100,"description":"CACHE TEST"}' > /dev/null
          third=$(curl -si "http://localhost:8080/summary/monthly?months=60" | grep -i '^x-cache' | tr -d '\r')
          echo "after write: $third"
          echo "$third" | grep -qi 'MISS'

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  web-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
