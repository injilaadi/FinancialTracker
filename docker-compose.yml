services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-financetracker}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # runs once, on first start of an empty volume
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/indexes.sql:/docker-entrypoint-initdb.d/02-indexes.sql:ro
      - ./db/matview.sql:/docker-entrypoint-initdb.d/03-matview.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml:
    build: ./ml
    ports:
      - "8001:8001"
    environment:
      MODEL_PATH: /app/models/model.joblib   # optional; without the file the service uses rules only
      MODEL_THRESHOLD: ${MODEL_THRESHOLD:-0.0}
    volumes:
      - ./ml/models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-financetracker}
      REDIS_URL: redis://redis:6379
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      ML_URL: http://ml:8001
      IMPORT_WORKERS: ${IMPORT_WORKERS:-1}
      ML_BATCH_SIZE: ${ML_BATCH_SIZE:-200}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml:
        condition: service_healthy

volumes:
  pgdata:
